name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Tauri CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Unit Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --workspace 2>&1 | Tee-Object -FilePath ci_build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build CLI Release Binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --release -p decryptor-cli 2>&1 | Tee-Object -Append -FilePath ci_build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Tauri Desktop App (NSIS + Portable EXE)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm install --no-save @tauri-apps/cli@^2 2>&1 | Tee-Object -Append -FilePath ci_build.log
          npx tauri build --bundles nsis 2>&1 | Tee-Object -Append -FilePath ci_build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\release\vpn-decryptor-desktop.exe" "dist\vpn-decryptor-desktop-portable.exe"
          Copy-Item "target\release\decryptor-cli.exe" "dist\decryptor-cli.exe"
          $nsis = Get-ChildItem "target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "dist\VPN-Decryptor-Setup.exe"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Decryptor-Windows-x64
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VPN Decryptor Desktop v1.0.${{ github.run_number }}"
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.exe

      - name: Post Failure Log Comment
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path ci_build.log) {
            $tail = (Get-Content ci_build.log -Tail 150) -join "`n"
            $bodyText = "### GitHub Actions Failure Log`n`n``````text`n$tail`n``````"
            if ($bodyText.Length -gt 60000) { $bodyText = $bodyText.Substring($bodyText.Length - 60000) }
            $payload = @{ body = $bodyText } | ConvertTo-Json
            Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
              -ContentType "application/json; charset=utf-8" `
              -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
          }
