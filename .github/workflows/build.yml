name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Tauri CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Unit Tests
        run: cargo test --workspace --locked || cargo test --workspace

      - name: Build CLI Release Binary
        run: cargo build --release -p decryptor-cli

      - name: Build Tauri Desktop App (NSIS + Portable EXE)
        run: |
          npm install --no-save @tauri-apps/cli@^2
          npx tauri build --bundles nsis

      - name: Stage Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\release\vpn-decryptor-desktop.exe" "dist\vpn-decryptor-desktop-portable.exe"
          Copy-Item "target\release\decryptor-cli.exe" "dist\decryptor-cli.exe"
          $nsis = Get-ChildItem "target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "dist\VPN-Decryptor-Setup.exe"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Decryptor-Windows-x64
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VPN Decryptor Desktop v1.0.${{ github.run_number }}"
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.exe
